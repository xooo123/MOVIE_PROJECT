server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Label HTML/CSS/JS responses as UTF-8 so emoji/special chars
    # (e.g. the ⭐ injected by trending.js) decode correctly.
    charset utf-8;

    # ---- API: proxy everything under /api/ to the FastAPI backend ----
    # The trailing slash on proxy_pass strips the /api/ prefix, so
    # /api/predict  -> backend:8000/predict
    # /api/trending -> backend:8000/trending
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ---- Pretty page routes ----
    location = /predictor {
        try_files /predictor.html =404;
    }

    location = /trending {
        try_files /trending.html =404;
    }

    # ---- Static files + home page fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
